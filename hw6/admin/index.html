<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MercyMed · Website editor</title><link rel="stylesheet" href="editor.css"><script type="module" src="editor.bundle.js"></script></head><body><div id="editor"><p class="loading">Opening the website editor…</p></div><div id="message" role="status" aria-live="polite"></div><dialog id="photo-dialog"><form id="photo-form"><h2>Add a photo</h2><p>JPG, PNG or WebP, up to 2 MB. Photos are resized and location metadata is removed.</p><label>Photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>Describe the photo for people who cannot see it<input name="alt" maxlength="500" required></label><label class="check"><input name="permission" type="checkbox" required> I have permission to publish this photo. It does not expose patient information.</label><div class="actions"><button type="submit">Upload photo</button><button type="button" id="cancel-photo" class="secondary">Cancel</button></div><p id="photo-error" role="alert"></p></form></dialog><dialog id="preview-dialog"><div class="preview-top"><strong>Draft preview — visitors cannot see these changes</strong><button id="close-preview">Close preview</button></div><iframe id="preview-frame" title="Website draft preview"></iframe></dialog></body></html>
